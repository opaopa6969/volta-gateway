<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Volta Admin</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111827;--panel2:#172033;--line:#273249;--text:#e5e7eb;--muted:#94a3b8;--brand:#60a5fa;--danger:#f87171;--ok:#4ade80}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:#0d1320;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
    .brand{font-size:18px;font-weight:750;padding:0 10px 18px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
    nav{display:grid;gap:3px}nav a{padding:9px 11px;border-radius:7px;text-decoration:none;color:#cbd5e1}nav a:hover,nav a.active{background:#1e293b;color:#fff}.content{min-width:0;padding:28px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:var(--muted)}
    .tenant{display:flex;align-items:center;gap:8px;white-space:nowrap}.tenant label{color:var(--muted);font-size:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 13px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;align-items:end}
    label.field{display:grid;gap:5px;color:var(--muted);font-size:12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #334155;border-radius:7px;background:#0b1220;color:var(--text);padding:9px 10px}textarea{min-height:70px;resize:vertical}
    button,.button{border:0;border-radius:7px;padding:9px 13px;background:#2563eb;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#334155}.danger{background:#7f1d1d;color:#fecaca}.small{padding:5px 8px;font-size:12px}
    .toolbar{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}.toolbar input{max-width:360px}.toolbar .spacer{flex:1}.status{min-height:22px;margin:8px 0;color:var(--muted)}.status.error{color:#fca5a5}.status.success{color:#86efac}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;background:var(--panel);min-width:720px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th{position:sticky;top:0;background:#172033;color:#cbd5e1;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}tr:hover td{background:#121d30}
    .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.actions select{width:auto;padding:5px 7px}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#1e3a5f;color:#bfdbfe;font-size:11px}.badge.ok{background:#14532d;color:#bbf7d0}.badge.off{background:#3f1d26;color:#fecdd3}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted)}
    .credential{white-space:pre-wrap;word-break:break-all;background:#07111f;border:1px solid #1d4ed8;border-radius:8px;padding:12px;margin-top:12px}.empty{padding:26px;text-align:center;color:var(--muted)}
    body.busy main{opacity:.72}.mobile-nav{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:820px){.shell{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding-bottom:10px}.sidebar nav{display:flex;overflow:auto}.sidebar nav a{white-space:nowrap}.content{padding:18px 12px}.top{display:grid}.tenant{white-space:normal}.tenant select{min-width:0}table{min-width:620px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">volta-auth <small>Rust Admin</small></div>
    <nav id="nav" aria-label="管理メニュー">
      <a data-page="dashboard" href="/admin/">Dashboard</a>
      <a data-page="users" href="/admin/users">Users</a>
      <a data-page="tenants" href="/admin/tenants">Tenants</a>
      <a data-page="members" href="/admin/members">Members</a>
      <a data-page="invitations" href="/admin/invitations">Invitations</a>
      <a data-page="sessions" href="/admin/sessions">Sessions</a>
      <a data-page="webhooks" href="/admin/webhooks">Webhooks</a>
      <a data-page="idp" href="/admin/idp">IdP Config</a>
      <a data-page="audit" href="/admin/audit">Audit Log</a>
      <a data-page="keys" href="/admin/keys">Signing Keys</a>
      <a data-page="temporary-access" href="/admin/temporary-access">Temporary Access</a>
    </nav>
  </aside>
  <main class="content">
    <header class="top">
      <div><h1 id="title">Admin</h1><p id="description"></p></div>
      <div class="tenant"><label for="tenant-select">操作対象テナント</label><select id="tenant-select" aria-label="操作対象テナント"></select></div>
    </header>
    <section id="actions"></section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="view"></section>
  </main>
</div>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const state = { tenants: [], tenantId: localStorage.getItem('volta.admin.tenant') || '', query: '' };
  const page = location.pathname === '/admin/' ? 'dashboard' : location.pathname.slice('/admin/'.length);
  const meta = {
    dashboard:['Dashboard','認証基盤の現在値を確認します。'],users:['Users','ユーザーを検索し、テナントへ事前登録します。'],tenants:['Tenants','テナントを一覧し、新しいテナントを作成します。'],members:['Members','選択中テナントのメンバーとロールを管理します。'],invitations:['Invitations','選択中テナントへの招待を発行・取消します。'],sessions:['Sessions','有効なセッションを確認・失効します。'],webhooks:['Webhooks','Webhook の作成・有効化・削除を行います。'],idp:['IdP Config','OIDC / SAML 設定を登録します。'],audit:['Audit Log','現在のセッションのテナントにある監査イベントを確認します。'],keys:['Signing Keys','署名鍵をローテーション・失効します。'],'temporary-access':['Temporary Access','期限・ドメインを限定した一時アクセスを発行します。']
  };
  const titles = meta[page] || ['Admin','管理画面'];
  document.title = titles[0] + ' — Volta Admin'; $('#title').textContent = titles[0]; $('#description').textContent = titles[1];
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));

  function status(message='', kind='') { const node=$('#status'); node.textContent=message; node.className='status '+kind; }
  function busy(on) { document.body.classList.toggle('busy', on); }
  function value(v) { if (v == null || v === '') return '—'; if (Array.isArray(v)) return v.join(', '); if (typeof v === 'boolean') return v ? 'Yes' : 'No'; if (typeof v === 'object') return JSON.stringify(v); return String(v); }
  function date(v) { if (!v) return '—'; const d=typeof v==='number' ? new Date(v*1000) : new Date(v); return Number.isNaN(d.getTime()) ? value(v) : d.toLocaleString('ja-JP'); }
  function items(data) { return Array.isArray(data) ? data : (data.items || data.tenants || data.users || data.sessions || []); }
  async function api(path, options={}) {
    const headers = {'accept':'application/json', ...(options.body ? {'content-type':'application/json'} : {}), ...(options.headers||{})};
    const response = await fetch(path, {...options, headers, credentials:'include'});
    if (response.status === 401) { location.href='/login?return_to='+encodeURIComponent(location.pathname+location.search); throw new Error('再ログインが必要です。'); }
    const body = response.status === 204 ? {} : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body?.error?.message || body?.message || `HTTP ${response.status}`);
    return body;
  }
  function button(label, className, handler) { const b=document.createElement('button'); b.type='button'; b.textContent=label; b.className=className||''; b.addEventListener('click',handler); return b; }
  function badge(text, active=true) { const n=document.createElement('span'); n.className='badge '+(active?'ok':'off'); n.textContent=text; return n; }
  function table(columns, rows, actionBuilder) {
    if (!rows.length) { const e=document.createElement('div'); e.className='card empty'; e.textContent='データがありません。'; $('#view').replaceChildren(e); return; }
    const wrap=document.createElement('div'); wrap.className='table-wrap'; const t=document.createElement('table');
    const head=document.createElement('thead'), hr=document.createElement('tr');
    [...columns, ...(actionBuilder?[{label:'操作'}]:[])].forEach(c=>{const th=document.createElement('th'); th.textContent=c.label; hr.append(th);}); head.append(hr); t.append(head);
    const body=document.createElement('tbody'); rows.forEach(row=>{const tr=document.createElement('tr'); columns.forEach(c=>{const td=document.createElement('td'); const out=c.render?c.render(row[c.key],row):value(row[c.key]); if(out instanceof Node)td.append(out);else td.textContent=out; if(c.mono)td.className='mono'; tr.append(td);}); if(actionBuilder){const td=document.createElement('td');td.className='actions';const built=actionBuilder(row);(Array.isArray(built)?built:[built]).filter(Boolean).forEach(n=>td.append(n));tr.append(td);} body.append(tr);});
    t.append(body); wrap.append(t); $('#view').replaceChildren(wrap);
  }
  function formCard(title, fields, submitLabel, onSubmit) {
    const card=document.createElement('section'); card.className='card'; const h=document.createElement('h2'); h.textContent=title; const form=document.createElement('form'); form.className='form-grid';
    fields.forEach(f=>{const label=document.createElement('label');label.className='field';label.append(document.createTextNode(f.label));let input;if(f.type==='select'){input=document.createElement('select');(f.options||[]).forEach(o=>{const opt=document.createElement('option');opt.value=typeof o==='string'?o:o.value;opt.textContent=typeof o==='string'?o:o.label;input.append(opt);});}else{input=document.createElement(f.type==='textarea'?'textarea':'input');if(f.type&&f.type!=='textarea')input.type=f.type;}input.name=f.name;if(f.placeholder)input.placeholder=f.placeholder;if(f.required)input.required=true;if(f.value!=null)input.value=f.value;label.append(input);form.append(label);});
    const submit=document.createElement('button');submit.type='submit';submit.textContent=submitLabel;form.append(submit);form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status('処理中…');try{const result=await onSubmit(Object.fromEntries(new FormData(form)));status('完了しました。','success');form.reset();if(result?.reloadTenants)await loadTenants();if(!result?.skipRender)await render();}catch(err){status(err.message,'error');}finally{submit.disabled=false;}});card.append(h,form);return card;
  }
  function toolbar(searchable=false) { const bar=document.createElement('div');bar.className='toolbar';if(searchable){const input=document.createElement('input');input.type='search';input.placeholder='検索…';input.value=state.query;input.addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=input.value.trim();render();}});bar.append(input,button('検索','secondary',()=>{state.query=input.value.trim();render();}));}const spacer=document.createElement('span');spacer.className='spacer';bar.append(spacer,button('再読込','secondary',async()=>{await loadTenants();await render();}));return bar; }
  function selectedTenant() { if (!state.tenantId) throw new Error('操作対象テナントを選択してください。'); return state.tenantId; }
  async function loadTenants() {
    const data=await api('/api/v1/admin/tenants?page=1&size=500&sort=name'); state.tenants=items(data); if(!state.tenants.some(t=>t.id===state.tenantId))state.tenantId=state.tenants[0]?.id||'';
    const select=$('#tenant-select');select.replaceChildren();state.tenants.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=`${t.name} (${t.slug})`;select.append(o);});select.value=state.tenantId;select.disabled=!state.tenants.length;select.addEventListener('change',()=>{state.tenantId=select.value;localStorage.setItem('volta.admin.tenant',state.tenantId);render();});
  }
  async function dashboard() {
    $('#actions').replaceChildren(); const urls=['/api/v1/admin/users?size=1','/api/v1/admin/tenants?size=1','/api/v1/admin/sessions?size=1','/api/v1/admin/audit?size=1']; const labels=['Users','Tenants','Active Sessions','Audit Events']; const data=await Promise.all(urls.map(u=>api(u)));
    const grid=document.createElement('div');grid.className='stats';data.forEach((d,i)=>{const c=document.createElement('div');c.className='stat';const strong=document.createElement('strong');strong.textContent=d.total??items(d).length;const span=document.createElement('span');span.textContent=labels[i];c.append(strong,span);grid.append(c);});$('#view').replaceChildren(grid);
  }
  async function users() {
    const card=formCard('ユーザーを追加',[{name:'email',label:'メールアドレス',type:'email',required:true,placeholder:'user@example.com'},{name:'display_name',label:'表示名',placeholder:'任意'},{name:'role',label:'ロール',type:'select',options:['MEMBER','VIEWER','OPERATOR','ADMIN']}],'+ ユーザー追加',async d=>api('/api/v1/admin/users',{method:'POST',body:JSON.stringify({...d,tenant_id:selectedTenant()})}));$('#actions').replaceChildren(card,toolbar(true));
    const data=await api('/api/v1/admin/users?page=1&size=100&sort=email&q='+encodeURIComponent(state.query));table([{key:'email',label:'Email'},{key:'display_name',label:'Name'},{key:'is_active',label:'Status',render:v=>badge(v?'Active':'Inactive',v)},{key:'created_at',label:'Created',render:date}],items(data));
  }
  async function tenants() {
    $('#actions').replaceChildren(formCard('テナントを作成',[{name:'name',label:'名前',required:true},{name:'slug',label:'Slug',required:true,placeholder:'team-name'}],'+ テナント作成',async d=>{await api('/api/v1/tenants',{method:'POST',body:JSON.stringify(d)});return {reloadTenants:true};}),toolbar(true));
    const data=await api('/api/v1/admin/tenants?page=1&size=100&sort=name&q='+encodeURIComponent(state.query));table([{key:'name',label:'Name'},{key:'slug',label:'Slug'},{key:'is_active',label:'Status',render:v=>badge(v?'Active':'Inactive',v)},{key:'created_at',label:'Created',render:date}],items(data));
  }
  async function members() {
    $('#actions').replaceChildren(toolbar()); const tid=selectedTenant(); const data=await api(`/api/v1/tenants/${tid}/members?page=1&size=100&sort=joined_at`);
    table([{key:'email',label:'Email'},{key:'display_name',label:'Name'},{key:'role',label:'Role',render:v=>badge(v,true)},{key:'joined_at',label:'Joined',render:date}],items(data),row=>{const role=document.createElement('select');['OWNER','ADMIN','OPERATOR','MEMBER','VIEWER'].forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;role.append(o);});role.value=row.role;const save=button('変更','secondary small',async()=>{try{await api(`/api/v1/tenants/${tid}/members/${row.id}`,{method:'PATCH',body:JSON.stringify({role:role.value})});status('ロールを変更しました。','success');await render();}catch(e){status(e.message,'error');}});const remove=button('削除','danger small',async()=>{if(!confirm(`${row.email||row.user_id} を削除しますか？`))return;try{await api(`/api/v1/tenants/${tid}/members/${row.id}`,{method:'DELETE'});status('メンバーを削除しました。','success');await render();}catch(e){status(e.message,'error');}});return[role,save,remove];});
  }
  async function invitations() {
    const tid=selectedTenant();$('#actions').replaceChildren(formCard('招待を発行',[{name:'email',label:'メールアドレス',type:'email',placeholder:'空欄なら制限なし'},{name:'role',label:'ロール',type:'select',options:['MEMBER','VIEWER','ADMIN']}],'+ 招待作成',d=>api(`/api/v1/tenants/${tid}/invitations`,{method:'POST',body:JSON.stringify({...d,email:d.email||null})})),toolbar());
    const data=await api(`/api/v1/tenants/${tid}/invitations?page=1&size=100`);table([{key:'code',label:'Code',mono:true},{key:'email',label:'Email'},{key:'role',label:'Role'},{key:'used_count',label:'Used',render:(v,r)=>`${v}/${r.max_uses}`},{key:'expires_at',label:'Expires',render:date}],items(data),row=>button('取消','danger small',async()=>{if(!confirm('この招待を取り消しますか？'))return;try{await api(`/api/v1/tenants/${tid}/invitations/${row.id}`,{method:'DELETE'});status('招待を取り消しました。','success');await render();}catch(e){status(e.message,'error');}}));
  }
  async function sessions() {
    $('#actions').replaceChildren(toolbar());const data=await api('/api/v1/admin/sessions?page=1&size=100&sort=-created_at');table([{key:'session_id_hash',label:'Session',mono:true},{key:'user_id',label:'User',mono:true},{key:'tenant_id',label:'Tenant',mono:true},{key:'ip_address',label:'IP'},{key:'user_agent',label:'User Agent'},{key:'created_at',label:'Created',render:date}],items(data),row=>button('失効','danger small',async()=>{if(!confirm('このセッションを失効しますか？'))return;try{await api(`/admin/sessions/${encodeURIComponent(row.session_id_hash)}`,{method:'DELETE'});status('セッションを失効しました。','success');await render();}catch(e){status(e.message,'error');}}));
  }
  async function webhooks() {
    const tid=selectedTenant();$('#actions').replaceChildren(formCard('Webhook を作成',[{name:'endpoint_url',label:'Endpoint URL',type:'url',required:true,placeholder:'https://example.com/hook'},{name:'events',label:'Events',required:true,placeholder:'login.success,user.created'}],'+ Webhook 作成',d=>api(`/api/v1/tenants/${tid}/webhooks`,{method:'POST',body:JSON.stringify(d)})),toolbar());const data=await api(`/api/v1/tenants/${tid}/webhooks`);
    table([{key:'endpoint_url',label:'Endpoint',mono:true},{key:'events',label:'Events'},{key:'is_active',label:'Status',render:v=>badge(v?'Active':'Inactive',v)}],items(data),row=>[button(row.is_active?'無効化':'有効化','secondary small',async()=>{try{await api(`/api/v1/tenants/${tid}/webhooks/${row.id}`,{method:'PATCH',body:JSON.stringify({is_active:!row.is_active})});status('Webhook を更新しました。','success');await render();}catch(e){status(e.message,'error');}}),button('削除','danger small',async()=>{if(!confirm('この Webhook を削除しますか？'))return;try{await api(`/api/v1/tenants/${tid}/webhooks/${row.id}`,{method:'DELETE'});status('Webhook を削除しました。','success');await render();}catch(e){status(e.message,'error');}})]);
  }
  async function idp() {
    const tid=selectedTenant();$('#actions').replaceChildren(formCard('IdP 設定を登録',[{name:'provider_type',label:'種別',type:'select',options:['OIDC','SAML']},{name:'issuer',label:'Issuer',placeholder:'https://issuer.example.com'},{name:'client_id',label:'Client ID'},{name:'client_secret',label:'Client Secret',type:'password'},{name:'metadata_url',label:'Metadata URL',type:'url'}],'+ IdP 登録',d=>api(`/api/v1/tenants/${tid}/idp-configs`,{method:'POST',body:JSON.stringify(Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v||null])))})),toolbar());const data=await api(`/api/v1/tenants/${tid}/idp-configs`);table([{key:'provider_type',label:'Type'},{key:'issuer',label:'Issuer',mono:true},{key:'client_id',label:'Client ID',mono:true},{key:'id',label:'ID',mono:true}],items(data));
  }
  async function audit() {
    $('#actions').replaceChildren(toolbar(true));let url='/api/v1/admin/audit?page=1&size=100&sort=-timestamp';if(state.query)url+='&event='+encodeURIComponent(state.query);const data=await api(url);table([{key:'timestamp',label:'Time',render:date},{key:'event_type',label:'Event'},{key:'actor_id',label:'Actor',mono:true},{key:'target_type',label:'Target'},{key:'target_id',label:'Target ID',mono:true}],items(data));
  }
  async function keys() {
    $('#actions').replaceChildren(formCard('署名鍵の操作',[], '新しい鍵へローテーション',async()=>{if(!confirm('署名鍵をローテーションしますか？'))throw new Error('キャンセルしました。');return api('/api/v1/admin/keys/rotate',{method:'POST',body:'{}'});}),toolbar());const data=await api('/api/v1/admin/keys');table([{key:'kid',label:'Key ID',mono:true},{key:'status',label:'Status',render:v=>badge(v,v==='ACTIVE')},{key:'created_at',label:'Created',render:date},{key:'rotated_at',label:'Rotated',render:date}],items(data),row=>row.status==='REVOKED'?null:button('失効','danger small',async()=>{if(!confirm('この鍵を失効しますか？既存トークンに影響します。'))return;try{await api(`/api/v1/admin/keys/${encodeURIComponent(row.kid)}/revoke`,{method:'POST',body:'{}'});status('鍵を失効しました。','success');await render();}catch(e){status(e.message,'error');}}));
  }
  async function temporaryAccess() {
    const tid=selectedTenant();const card=formCard('一時アクセスを発行',[{name:'subject',label:'Subject',required:true,placeholder:'user@example.com / program:name'},{name:'role',label:'ロール',type:'select',options:['MEMBER','VIEWER','ADMIN']},{name:'domains',label:'許可ドメイン',required:true,placeholder:'app.unlaxer.org, *.example.com'},{name:'blocked_domains',label:'除外ドメイン',placeholder:'admin.example.com'},{name:'duration_hours',label:'有効時間',type:'number',required:true,value:'24'}],'一時アクセスを発行',async d=>{const now=new Date(),expires=new Date(now.getTime()+Number(d.duration_hours)*3600000);const body={tenant_id:tid,subject:d.subject,role:d.role,domains:d.domains.split(',').map(x=>x.trim()).filter(Boolean),blocked_domains:d.blocked_domains.split(',').map(x=>x.trim()).filter(Boolean),starts_at:now.toISOString(),expires_at:expires.toISOString()};const out=await api('/api/v1/temporary-access',{method:'POST',body:JSON.stringify(body)});const box=document.createElement('div');box.className='credential';box.textContent='Bearer（この一度だけ表示）\nAuthorization: Bearer '+out.bearer;card.append(box);return {skipRender:true};});$('#actions').replaceChildren(card,toolbar());const data=await api('/api/v1/temporary-access?tenant_id='+encodeURIComponent(tid));table([{key:'subject',label:'Subject'},{key:'role',label:'Role'},{key:'domains',label:'Domains'},{key:'starts_at',label:'Starts',render:date},{key:'expires_at',label:'Expires',render:date},{key:'revoked_at',label:'Revoked',render:date}],items(data),row=>row.revoked_at?null:button('失効','danger small',async()=>{if(!confirm('この一時アクセスを失効しますか？'))return;try{await api(`/api/v1/temporary-access/${row.id}`,{method:'DELETE'});status('一時アクセスを失効しました。','success');await render();}catch(e){status(e.message,'error');}}));
  }
  const renderers={dashboard,users,tenants,members,invitations,sessions,webhooks,idp,audit,keys,'temporary-access':temporaryAccess};
  async function render(){status('読込中…');busy(true);try{const fn=renderers[page];if(!fn)throw new Error('画面が見つかりません。');await fn();status();}catch(err){status(err.message,'error');const e=document.createElement('div');e.className='card empty';e.textContent='表示できませんでした。';$('#view').replaceChildren(e);}finally{busy(false);}}
  loadTenants().then(render).catch(err=>{status(err.message,'error');busy(false);});
})();
</script>
</body>
