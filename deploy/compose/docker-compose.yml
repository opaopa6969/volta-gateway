# Minimal standalone volta stack: postgres + auth-server + gateway + a dummy
# backend (traefik/whoami echoes the request headers it receives).
#
# Everything is served from one origin, http://localhost:${VOLTA_PORT:-18080}:
# the gateway sends the auth paths (/login, /auth/, ...) to auth-server and
# everything else, after ForwardAuth, to the backend with X-Volta-* headers.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   ./deploy/compose/smoke-test.sh          # dev magic-link login -> headers reach the backend
#   docker compose -f deploy/compose/docker-compose.yml down -v
#
# Development only: AUTH_EXPOSE_DEV_TOKEN returns login links in API responses
# and the secrets below have dev defaults. See docs/standalone-deploy.md.
name: volta-standalone-example

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volta_auth
      POSTGRES_USER: volta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volta-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volta -d volta_auth"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth-server:
    build:
      context: ../..
      dockerfile: Dockerfile.auth-server
    image: ${VOLTA_AUTH_IMAGE:-volta-auth-server:dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "7070"
      DATABASE_URL: postgres://volta:${POSTGRES_PASSWORD:-volta-dev-only}@postgres:5432/volta_auth
      JWT_SECRET: ${JWT_SECRET:-volta-standalone-dev-secret-change-me-0123456789}
      # Public URL of the auth endpoints (here: the gateway origin).
      BASE_URL: ${VOLTA_PUBLIC_URL:-http://localhost:18080}
      # Empty = host-only cookies (right for a single origin like localhost).
      # For app.example.com + auth.example.com set ".example.com".
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Unset → derived from COOKIE_DOMAIN, else only the BASE_URL host.
      ALLOWED_RETURN_TO_DOMAINS: ${ALLOWED_RETURN_TO_DOMAINS:-}
      # Create the schema from auth-core/migrations on first start.
      AUTH_AUTO_MIGRATE: "true"
      # Dev login without mail: /auth/magic-link/send returns the link.
      AUTH_EXPOSE_DEV_TOKEN: ${AUTH_EXPOSE_DEV_TOKEN:-true}
      RUST_LOG: ${RUST_LOG:-volta_auth_server=info}
      # Optional IdP (blank = built-in Google entry, unused without a client id).
      IDP_PROVIDER: ${IDP_PROVIDER:-}
      IDP_ISSUER_URL: ${IDP_ISSUER_URL:-}
      IDP_CLIENT_ID: ${IDP_CLIENT_ID:-}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-}
      IDP_DISPLAY_NAME: ${IDP_DISPLAY_NAME:-}
    healthcheck:
      # The slim image has no curl; bash's /dev/tcp is enough for /healthz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7070 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    image: ${VOLTA_GATEWAY_IMAGE:-volta-gateway:dev}
    depends_on:
      auth-server:
        condition: service_healthy
      backend:
        condition: service_started
    configs:
      - source: gateway_config
        target: /etc/volta-gateway/volta-gateway.yaml
    ports:
      - "${VOLTA_BIND:-127.0.0.1}:${VOLTA_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "volta-gateway", "--health-check", "8080"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Stand-in for your application. Replace with your own service and point the
  # route's `backend` at it.
  backend:
    image: traefik/whoami:v1.10

volumes:
  pgdata:

configs:
  gateway_config:
    # Inline so ${VOLTA_PUBLIC_URL} etc. are interpolated by compose.
    content: |
      config_version: 3
      server:
        port: 8080
      auth:
        volta_url: http://auth-server:7070
        # Absolute redirects from auth-server (to BASE_URL/login) are only
        # passed through to the browser for this origin.
        auth_public_url: ${VOLTA_PUBLIC_URL:-http://localhost:18080}
      routing:
        - host: ${VOLTA_PUBLIC_HOST:-localhost}
          backend: http://backend:80
          # Served by auth-server without ForwardAuth (login UI and APIs).
          auth_bypass_paths:
            - { prefix: /login, backend: "http://auth-server:7070" }
            - { prefix: /callback, backend: "http://auth-server:7070" }
            - { prefix: /auth/, backend: "http://auth-server:7070" }
            - { prefix: /mfa/, backend: "http://auth-server:7070" }
            - { prefix: /invite/, backend: "http://auth-server:7070" }
            - { prefix: /select-tenant, backend: "http://auth-server:7070" }
            - { prefix: /register, backend: "http://auth-server:7070" }
            - { prefix: /accounts, backend: "http://auth-server:7070" }
